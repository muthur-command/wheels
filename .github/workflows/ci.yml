name: CI

on:
  push:
    branches:
      - mc
  pull_request:
    branches:
      - mc

env:
  PYTHON_VERSION: "3.13"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt -r requirements_tests.txt

      - name: Run pytest
        run: pytest

  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt -r requirements_tests.txt

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          PREK_SKIP: no-commit-to-branch

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: "Dockerfile"
          failure-threshold: warning

  test:
    name: Test wheels ${{ matrix.arch }}-${{ matrix.abi }}-${{ matrix.tag }}
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        abi: ["cp313", "cp314"]
        tag: ["musllinux_1_2"]
        arch: ["aarch64", "amd64"]
        include:
          - runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels builder image for CI
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.abi }}" in
            cp313) base="3.13-alpine3.22" ;;
            cp314) base="3.14-alpine3.22" ;;
            *) echo "Unsupported ABI: ${{ matrix.abi }}" >&2; exit 1 ;;
          esac
          img="ghcr.io/muthur-command/wheels/${{ matrix.arch }}/${{ matrix.tag }}/${{ matrix.abi }}:dev"
          docker build \
            --build-arg "BUILD_FROM=ghcr.io/muthur-command/${{ matrix.arch }}-base-python:${base}" \
            --build-arg "BUILD_ARCH=${{ matrix.arch }}" \
            --build-arg "CPYTHON_ABI=${{ matrix.abi }}" \
            -t "$img" \
            .
          echo "Built $img"

      - name: Write env-file
        shell: bash
        run: |
          (
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          ) > .env_file

      - name: Build wheels
        uses: ./
        with:
          abi: ${{ matrix.abi }}
          tag: ${{ matrix.tag }}
          arch: ${{ matrix.arch }}
          apk: "mariadb-dev;postgresql-dev;libffi-dev;openssl-dev"
          skip-binary: "orjson"
          env-file: True
          test: True
          requirements: "requirements_wheels_test.txt"

  test_local_repo:
    name: Test publishing to a local repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels builder image for CI
        shell: bash
        run: |
          set -euxo pipefail
          img="ghcr.io/muthur-command/wheels/amd64/musllinux_1_2/cp314:dev"
          docker build \
            --build-arg BUILD_FROM=ghcr.io/muthur-command/amd64-base-python:3.14-alpine3.22 \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg CPYTHON_ABI=cp314 \
            -t "$img" \
            .

      - name: Write env-file
        shell: bash
        run: |
          (
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          ) > .env_file

      - name: Build wheels
        uses: ./
        with:
          abi: cp314
          tag: musllinux_1_2
          arch: amd64
          apk: "mariadb-dev;postgresql-dev;libffi-dev;openssl-dev"
          skip-binary: "orjson"
          env-file: True
          requirements: "requirements_wheels_test.txt"
          local-wheels-repo-path: "/tmp/local_wheels"
          wheels-user: ""
          wheels-host: ""

      - name: Check for local wheels
        shell: bash
        run: |
          missing=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            # Skip empty lines
            [[ -z "$line" ]] && continue
            # Extract package name (before ==)
            pkg_name="${line%%==*}"
            # Normalize: replace - with _, convert to lowercase
            normalized=$(echo "$pkg_name" | tr '[:upper:]-' '[:lower:]_')
            # Check if wheel exists (case-insensitive glob)
            if ! compgen -G "/tmp/local_wheels/musllinux/${normalized}-"*.whl > /dev/null; then
              echo "::error::Missing wheel for package: $pkg_name"
              missing=1
            else
              echo "Found wheel for package: $pkg_name"
            fi
          done < requirements_wheels_test.txt
          exit $missing
